<html lang="en"><head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>signal / noise</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
  <style>
    body {

    margin: auto;
    padding: 0;
    display: flex;
    justify-content: center;
    align-items: center;
    background: black;
    max-height: 100vh;
    max-width: 100vw;
    overflow: hidden;
    aspect-ratio: 17 / 22;
    }

    .flyer-container {
      position: relative;
      aspect-ratio: 17 / 22;
      width: 100vw;
      max-height: 100vh;
      background-color: black;
      overflow: hidden;
    }

    .flyer-background {
      position: absolute;
      width: 100%;
      height: 100%;
      object-fit: contain;
      z-index: 0;
    }

    .overlay {
      position: absolute;
      z-index: 1;
      max-width: 100%;
      height: auto;
      opacity: 0;
      animation: fadeIn 1.5s forwards;
    }

    /* Position each overlay image */
    .header {
      top: 2%;
      left: 2%;
      width: 96%;
      animation-delay: 0.2s;
    }

    .when-where {
      top: 48%;
      left: 0%;
      width: 55%;
      animation: slideIn 1.8s forwards;
      animation-delay: 0.5s;
    }

    .lineup {
      top: 67%;
      left: 3%;
      width: 53%;
      animation: slideInRight 1.8s forwards;
      animation-delay: 0.8s;
    }

    .greenscreen {
      top: 31%;
      right: 1%;
      width: 52%;
      animation: fadeIn 1.5s forwards;
      animation-delay: 1s;
    }

    .greenscreen img {
      position: relative;
      top: 0;
      right: 0;
      width: 100%;
      opacity: 1;
    }
    
    /* Text styling */
    .terminal-text {
      position: relative;
    }
    
    /* No line wrappers - we'll use the original HTML structure */
    
    /* More pronounced glowing text effect for characters only */
    .intensify-glitch .terminal-text {
      color: #20ff80; /* Change the text color to green */
      text-shadow: 0 0 10px rgba(32, 255, 128, 0.9), 0 0 20px rgba(32, 255, 128, 0.7);
      animation: pronouncedPulse 1s ease-in-out infinite;
    }
    
    @keyframes pronouncedPulse {
      0%, 100% { 
        color: #20ff80; 
        text-shadow: 0 0 10px rgba(32, 255, 128, 0.9), 0 0 20px rgba(32, 255, 128, 0.7);
      }
      50% { 
        color: #ffffff; 
        text-shadow: 0 0 15px rgba(32, 255, 128, 1), 0 0 25px rgba(32, 255, 128, 0.8);
      }
    }

    .terminal-text-container {
      position: absolute;
      top: 13%;
      left: 12%;
      width: 71%;
      height: auto;
      z-index: 10000;
      overflow: visible;
      display: flex;
      flex-direction: column;
      justify-content: flex-start;
      pointer-events: none;
    }

    .fullscreen-greenscreen {
      position: fixed !important;
      top: 0 !important;
      left: 0 !important;
      width: 100vw !important;
      height: 100vh !important;
      z-index: 9999;
      background-color: black;
      display: flex;
      justify-content: center;
      align-items: center;
      animation: expandScreen 0.6s ease-in-out forwards;
    }

    /* Create a container for the greenscreen monitor that maintains aspect ratio */
    .fullscreen-greenscreen-container {
      position: relative;
      width: 92%;
      max-width: 1400px;
      max-height: 90vh;
      margin: 0 auto;
      /* Simple flex container to center the image */
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .fullscreen-greenscreen img {
      position: relative;
      width: 100%;
      height: auto;
      max-height: 90vh;
      /* Preserve aspect ratio without distortion */
      object-fit: contain;
      opacity: 1;
    }

    /* Position text precisely within the monitor area of the greenscreen image */
    .fullscreen-greenscreen .terminal-text-container {
      position: absolute;
      /* These percentages map exactly to the monitor screen area in the image */
      top: 13%;
      left: 12%;
      width: 73%;
      height: 75%;
      /* Remove max-width/height constraints to maintain exact positioning */
      max-width: none;
      max-height: none;
      /* No scrolling needed - all text should be visible */
      overflow: visible;
      /* Remove padding that could affect positioning */
      padding: 0;
      /* Text alignment */
      text-align: left;
      /* Subtle text shadow for readability */
      text-shadow: 0 0 2px rgba(0, 0, 0, 0.5);
      /* Font size is preserved from the small greenscreen */
      /* Ensure proper box sizing */
      box-sizing: border-box;
    }

    .terminal-text {
      font-family: "VT323", monospace;
      color: #ffffff;
      /* Font size will be set dynamically by JavaScript */
      white-space: pre-wrap;
      margin: 0;
      padding: 0;
    }

    .cursor {
      display: inline-block;
      /* Width and height will be set dynamically by JavaScript */
      background-color: #ffffff;
      margin-left: 2px;
      animation: blink 1s step-end infinite;
      vertical-align: text-bottom;
    }

    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }

    .sn-logo {
      bottom: 3%;
      right: 32%;
      width: 5%;
      animation-delay: 2s;
    }

    .website-logo {
      bottom: 3%;
      right: 5%;
      width: 25%;
      animation-delay: 0.5s;
    }

    /* Animations */
    @keyframes fadeIn {
      0% {
        opacity: 0;
        transform: translateY(-50px);
      }
      100% {
        opacity: 1;
        transform: translateY(0);
      }
    }
    
    /* We'll use JavaScript for the random glitch effect instead of CSS animations */

    @keyframes slideIn {
      0% {
        opacity: 0;
        transform: translateX(-50px);
      }
      100% {
        opacity: 1;
        transform: translateX(0);
      }
    }

    @keyframes slideInRight {
      0% {
        opacity: 0;
        transform: translateX(50px);
      }
      100% {
        opacity: 1;
        transform: translateX(0);
      }
    }

    @keyframes expandScreen {
      0% {
        transform: scale(1);
        opacity: 1;
      }
      100% {
        transform: scale(1.1);
        opacity: 1;
      }
    }

    /* Fade out overlays except greenscreen */
    .overlay-fade-out:not(.greenscreen) {
      animation: fadeOut 0.5s ease-in-out forwards;
    }

    .flyer-container.fade-out {
      animation: fadeOut 0.5s ease-in-out forwards;
    }

    @keyframes fadeOut {
      to {
        opacity: 0;
      }
    }
  </style>

  <script>
    let typewriterTimeout;

    // Function to adjust font size based on greenscreen size
    function adjustFontSize() {
      const greenscreen = document.querySelector('.greenscreen');
      const terminalText = document.querySelector('.terminal-text');
      const cursor = document.querySelector('.cursor');
      
      if (greenscreen && terminalText && cursor) {
        const greenscreenWidth = greenscreen.offsetWidth;
        
        // Set font size to be proportional to the greenscreen width
        const fontSize = greenscreenWidth * 0.044;
        terminalText.style.fontSize = `${fontSize}px`;
        
        // Adjust cursor size proportionally
        cursor.style.width = `${fontSize * 0.4}px`;
        cursor.style.height = `${fontSize * 1.1}px`;
      }
    }
    
    // Store the original font size to preserve it when expanding the greenscreen
    let originalFontSize;

    document.addEventListener('DOMContentLoaded', function() {
      // Wait for the greenscreen image to appear (it has a 1s animation delay)
      setTimeout(function() {
        // Use standard HTML markup for formatting
        const htmlText = `this is for the hacker punks... 

 the ones who <u>break to make better</u>... 
 who write <u>zines and zero-days</u>... 
 who still <u>question the answers</u>... 
 who <u>DIYed before it was downloadable</u>...

this isn't nostalgia... 
      ...it's <u>defiance with better tools</u>

we didn't outgrow <u>we upgraded</u>`;

        const terminalText = document.getElementById('terminal-text');
        let displayText = '';
        let rawText = '';
        let i = 0;
        let inTag = false;
        let currentTag = '';
        
        function typeWriter() {
          if (i < htmlText.length) {
            const char = htmlText.charAt(i);
            
            // Handle HTML tags
            if (char === '<') {
              inTag = true;
              currentTag = '<';
            } else if (char === '>' && inTag) {
              inTag = false;
              currentTag += '>';
              displayText += currentTag;
              
              // Don't add tags to raw text
              currentTag = '';
            } else if (inTag) {
              currentTag += char;
            } else if (char === '\n') {
              // Handle line breaks
              displayText += '<br>';
              rawText += '\n';
            } else {
              // Regular character
              displayText += char;
              rawText += char;
            }
            
            // Update the HTML
            terminalText.innerHTML = displayText;
            
            i++;
            // Random typing speed between 10ms and 40ms for a faster effect to ensure all text is visible
            const typingSpeed = Math.floor(Math.random() * 30) + 10;
            typewriterTimeout = setTimeout(typeWriter, typingSpeed);
          } else {
            // When typing is complete, wrap each line in a span for the glitch effect
            wrapLinesForGlitch();
          }
        }
        
        // We don't need to wrap lines anymore - we'll use the original HTML structure
        function wrapLinesForGlitch() {
          // Do nothing - keep original HTML structure
        }
        
        // Adjust font size initially and store the original size
        adjustFontSize();
        // Store the original font size for later use
        originalFontSize = window.getComputedStyle(terminalText).fontSize;
        
        // Start the typewriter effect
        setTimeout(function() {
          typeWriter();
        }, 500); // Reduced delay to start typing sooner
      }, 1200); // Adjusted timing to start after the animation begins
      
      // Add resize event listeners to adjust font size when window is resized
      window.addEventListener('resize', function() {
        // Only adjust font size if the greenscreen is not in fullscreen mode
        if (!assignmentShown) {
          adjustFontSize();
        }
      });
    });

    // --- Assignment menu with glitch effect on long press/hover ---
    let assignmentShown = false;
    let pressTimer;
    const greenscreen = document.querySelector('.greenscreen');
    const terminalText = document.getElementById('terminal-text');
    const cursor = document.querySelector('.cursor');

    const assignmentText = `hey punk if you're bored take an assignment:
-destroy/deface a piece of corporate swag (one you own, obviously)
-dress like Fat Mike in drag at BlackHat
-sing the NOFX song "August 8th" on August 8th at the triple down
-work punk lyrics into your BlackHat talk or use ../.. on your slides
-hand out Hacker's Manifesto leaflets next to strip club barkers
-get Fat Mike to yell "Hack the Planet" with you
-get a ../.. tattoo – or convince someone else to
-spread ../.. stickers around BSidesLV, BlackHat, and DEF CON
-wear your punk battle vest at BlackHat and schedule an interview
-dress like a CrowdStrike Dahmer doll and hang out by their booth
-give a lightning talk in a dive bar bathroom to a standing audience
-use "signal/noise" as your company name on your BlackHat badge
-make up your own assignment and show it off at the event
-ask for Mojo Nixon at a BlackHat vendor booth. if they say "he don't work here" tell them their booth could use some fixin'

PIC || GTFO - or fuck it, do it live

this is a punk rock flyer, not an incitement to harassment 
be safe... be sane... stay legal... and let your creativity loose`;

    function showAssignmentMenu() {
      if (assignmentShown) return;
      assignmentShown = true;

      // Send event to Google Analytics
      gtag('event', 'menu_trigger', {
        'event_category': 'engagement',
        'event_label': 'hidden_assignment_menu'
      });

      // Fade out overlays except greenscreen
      const overlays = document.querySelectorAll('.overlay:not(.greenscreen)');
      overlays.forEach(el => el.classList.add('overlay-fade-out'));

      // Create a container for the greenscreen to maintain aspect ratio
      greenscreen.classList.add('fullscreen-greenscreen');
      
      // Wrap the image in a container for better positioning
      const greenscreenImg = greenscreen.querySelector('img');
      const terminalContainer = greenscreen.querySelector('.terminal-text-container');
      
      // Only create the container if it doesn't exist yet
      if (!greenscreen.querySelector('.fullscreen-greenscreen-container')) {
        const container = document.createElement('div');
        container.className = 'fullscreen-greenscreen-container';
        
        // Move the image and terminal container into the new container
        greenscreen.appendChild(container);
        container.appendChild(greenscreenImg);
        container.appendChild(terminalContainer);
      }
      clearTimeout(typewriterTimeout);
      
      // Just use the original text with line breaks
      terminalText.innerHTML = assignmentText.replace(/\n/g, '<br>');
      if (cursor) cursor.style.display = 'none';
      
      // No need to adjust font size after expansion - we keep the original size
    }

    // Variable to track the glitch interval
    let glitchInterval;
    
    function startPressTimer() {
      // Add a class to intensify the glitch effect when pressed
      const greenscreen = document.querySelector('.greenscreen');
      if (greenscreen) {
        greenscreen.classList.add('intensify-glitch');
        
        // Start the random line glitch effect
        startRandomGlitch();
      }
      
      pressTimer = setTimeout(showAssignmentMenu, 3000);
    }

    function cancelPressTimer() {
      clearTimeout(pressTimer);
      
      // Remove the intensify class when press is canceled
      const greenscreen = document.querySelector('.greenscreen');
      if (greenscreen) {
        greenscreen.classList.remove('intensify-glitch');
        
        // Stop the random line glitch effect
        stopRandomGlitch();
      }
    }
    
    // Function to add glow effect to all text
    function startRandomGlitch() {
      // No need for intervals or random selection
      // The CSS will handle the glow effect for all text
    }
    
    // Function to stop the glow effect
    function stopRandomGlitch() {
      // No need to do anything here
      // The CSS will handle removing the glow when the class is removed
    }

    if (greenscreen) {
      greenscreen.addEventListener('mousedown', startPressTimer);
      greenscreen.addEventListener('touchstart', startPressTimer);
      greenscreen.addEventListener('mouseup', cancelPressTimer);
      greenscreen.addEventListener('mouseleave', cancelPressTimer);
      greenscreen.addEventListener('touchend', cancelPressTimer);
    }
  </script>
