<html lang="en"><head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>signal / noise</title>
  <style>
    body {

    margin: auto;
    padding: 0;
    display: flex;
    justify-content: center;
    align-items: center;
    background: black;
    max-height: 100vh;
    max-width: 100vw;
    overflow: hidden;
    aspect-ratio: 17 / 22;
    }

    .flyer-container {
      position: relative;
      aspect-ratio: 17 / 22;
      width: 100vw;
      max-height: 100vh;
      background-color: black;
      overflow: hidden;
    }

    .flyer-background {
      position: absolute;
      width: 100%;
      height: 100%;
      object-fit: contain;
      z-index: 0;
    }

    .overlay {
      position: absolute;
      z-index: 1;
      max-width: 100%;
      height: auto;
      opacity: 0;
      animation: fadeIn 1.5s forwards;
    }

    /* Position each overlay image */
    .header {
      top: 2%;
      left: 2%;
      width: 96%;
      animation-delay: 0.2s;
    }

    .when-where {
      top: 48%;
      left: 0%;
      width: 55%;
      animation: slideIn 1.8s forwards;
      animation-delay: 0.5s;
    }

    .lineup {
      top: 67%;
      left: 3%;
      width: 53%;
      animation: slideInRight 1.8s forwards;
      animation-delay: 0.8s;
    }

    .greenscreen {
      top: 31%;
      right: 1%;
      width: 52%;
      animation: fadeIn 1.5s forwards;
      animation-delay: 1s;
    }

    .greenscreen img {
      position: relative;
      top: 0;
      right: 0;
      width: 100%;
      opacity: 1;
    }

    .terminal-text-container {
      position: absolute;
      top: 13%;
      left: 12%;
      width: 71%;
      height: 70%;
      z-index: 2;
      overflow: visible;
      display: flex;
      flex-direction: column;
      justify-content: flex-start;
    }

    .terminal-text {
      font-family: monospace;
      color: #f5f5f5;
      /* Font size will be set dynamically by JavaScript */
      line-height: 1.2;
      white-space: pre-wrap;
      text-shadow: 0 0 5px rgba(255, 255, 255, 0.7);
      margin: 0;
      padding: 0;
    }

    .cursor {
      display: inline-block;
      /* Width and height will be set dynamically by JavaScript */
      background-color: #f5f5f5;
      margin-left: 2px;
      animation: blink 1s step-end infinite;
      vertical-align: text-bottom;
    }

    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }

    .sn-logo {
      bottom: 3%;
      right: 32%;
      width: 5%;
      animation-delay: 2s;
    }

    .website-logo {
      bottom: 3%;
      right: 5%;
      width: 25%;
      animation-delay: 0.5s;
    }

    /* Animations */
    @keyframes fadeIn {
      0% {
        opacity: 0;
        transform: translateY(-50px);
      }
      100% {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes slideIn {
      0% {
        opacity: 0;
        transform: translateX(-50px);
      }
      100% {
        opacity: 1;
        transform: translateX(0);
      }
    }

    @keyframes slideInRight {
      0% {
        opacity: 0;
        transform: translateX(50px);
      }
      100% {
        opacity: 1;
        transform: translateX(0);
      }
    }
  </style>
  <!-- Google tag (gtag.js) -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-VVJ4EDS16X"></script>
<script>

  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());

  gtag('config', 'G-VVJ4EDS16X');
</script>
  <link rel="icon" href="favicon.png" type="image/png">
</head>
<body>
  <div class="flyer-container">
    <img src="background.png" class="flyer-background" alt="Flyer background">

    <img src="header.png" class="overlay header" alt="Header">
    <img src="whenwhere.png" class="overlay when-where" alt="When and Where">
    <img src="lineup.png" class="overlay lineup" alt="Lineup">
    <div class="overlay greenscreen">
      <img src="greenscreen_blank.png" alt="Greenscreen">
      <div class="terminal-text-container">
        <span class="terminal-text" id="terminal-text"></span>
        <span class="cursor"></span>
      </div>
    </div>
    <img src="sn_logo.png" class="overlay sn-logo" alt="Signal Noise Logo">
    <img src="website.png" class="overlay website-logo" alt="Website Info">
  </div>

  <script>
    // Function to adjust font size based on greenscreen size
    function adjustFontSize() {
      const greenscreen = document.querySelector('.greenscreen');
      const terminalText = document.querySelector('.terminal-text');
      const cursor = document.querySelector('.cursor');
      
      if (greenscreen && terminalText && cursor) {
        const greenscreenWidth = greenscreen.offsetWidth;
        
        // Set font size to be proportional to the greenscreen width
        const fontSize = greenscreenWidth * 0.029;
        terminalText.style.fontSize = `${fontSize}px`;
        
        // Adjust cursor size proportionally
        cursor.style.width = `${fontSize * 0.4}px`;
        cursor.style.height = `${fontSize * 1.1}px`;
      }
    }

    document.addEventListener('DOMContentLoaded', function() {
      // Wait for the greenscreen image to appear (it has a 1s animation delay)
      setTimeout(function() {
        // Use standard HTML markup for formatting
        const htmlText = `this is for the hacker punks... 

 the ones who <u>break to make better</u>... 
 who write <u>zines and zero-days</u>... 
 who still <u>question the answers</u>... 
 who <u>DIYed before it was downloadable</u>...

this isn't nostalgia... 
      ...it's <u>defiance with better tools</u>

we didn't outgrow <u>we upgraded</u>`;

        const terminalText = document.getElementById('terminal-text');
        let displayText = '';
        let rawText = '';
        let i = 0;
        let inTag = false;
        let currentTag = '';
        
        function typeWriter() {
          if (i < htmlText.length) {
            const char = htmlText.charAt(i);
            
            // Handle HTML tags
            if (char === '<') {
              inTag = true;
              currentTag = '<';
            } else if (char === '>' && inTag) {
              inTag = false;
              currentTag += '>';
              displayText += currentTag;
              
              // Don't add tags to raw text
              currentTag = '';
            } else if (inTag) {
              currentTag += char;
            } else if (char === '\n') {
              // Handle line breaks
              displayText += '<br>';
              rawText += '\n';
            } else {
              // Regular character
              displayText += char;
              rawText += char;
            }
            
            // Update the HTML
            terminalText.innerHTML = displayText;
            
            i++;
            // Random typing speed between 10ms and 40ms for a faster effect to ensure all text is visible
            const typingSpeed = Math.floor(Math.random() * 30) + 10;
            setTimeout(typeWriter, typingSpeed);
          }
        }
        
        // Adjust font size initially
        adjustFontSize();
        
        // Start the typewriter effect
        setTimeout(function() {
          typeWriter();
        }, 500); // Reduced delay to start typing sooner
      }, 1200); // Adjusted timing to start after the animation begins
      
      // Add resize event listener to adjust font size when window is resized
      window.addEventListener('resize', adjustFontSize);
    });
  </script>
</body></html>
